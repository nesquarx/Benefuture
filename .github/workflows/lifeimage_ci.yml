name: Life Image CI

on:
  push:
    paths: ['lifeImage/**', '.github/workflows/lifeimage_ci.yml']
  pull_request:
    paths: ['lifeImage/**', '.github/workflows/lifeimage_ci.yml']

concurrency:
  group: lifeimage-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install jsonschema pytest numpy
      - run: pytest lifeImage/tests
