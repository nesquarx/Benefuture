name: Determinism probe
# Manual only. Runs tools/determinism/trace_probe.jl in each environment and uploads the JSON;
# compare any two with `python3 tools/determinism/compare.py A.json B.json`.
on:
  workflow_dispatch:
    inputs:
      seeds:
        description: "comma-separated seeds"
        default: "4"
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        julia: ["1.13.3"]
        threads: ["1", "4"]
        include:
          - { os: ubuntu-latest, julia: "1.13.4", threads: "1" }
          - { os: macos-latest, julia: "1.13.4", threads: "1" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with: { version: "${{ matrix.julia }}" }
      - name: Toolchains (Lean)
        run: tools/setup/toolchains.sh
      - name: Instantiate
        run: julia --project=sim -e 'using Pkg; Pkg.instantiate()'
      - name: Probe
        env:
          JULIA_NUM_THREADS: ${{ matrix.threads }}
        run: |
          export PATH="$HOME/.local/bin:$HOME/.elan/bin:$PATH"
          mkdir -p out
          julia --project=sim tools/determinism/trace_probe.jl "out/${{ matrix.os }}-j${{ matrix.julia }}-t${{ matrix.threads }}.json" "${{ inputs.seeds }}" | tee out/summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ matrix.os }}-j${{ matrix.julia }}-t${{ matrix.threads }}
          path: out/
