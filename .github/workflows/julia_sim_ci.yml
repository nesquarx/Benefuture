name: Julia Sim CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The toolchain download from releases.lean-lang.org fails intermittently: cache it, and retry.
      - name: Cache the Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}

      - name: Install elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install the Lean toolchain
        run: |
          for attempt in 1 2 3 4; do
            elan toolchain install "$(cat lean-toolchain)" && exit 0
            sleep $((attempt * 15))
          done
          exit 1

      # The rules the simulation calls live in the Lean reference library.
      - name: Build the Lean reference library
        run: lake build BenefutureReference:shared

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'

      - name: Test BenefutureSim
        run: julia --project=sim -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
