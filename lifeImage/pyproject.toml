[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeimage"
version = "0.0.0"
description = "Life Image tooling: domain cards, cached micro-tasks, basemap invariants, migration."
requires-python = ">=3.11"
dependencies = ["jsonschema>=4", "numpy>=1.24", "pillow>=10"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["lifeimage", "lifeimage.generators", "lifeimage.sources", "lifeimage.eventgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not full'"
markers = ["full: heavy tests (large worlds, many seeds); excluded from the default fast tier, run with `-m full` or BF_TIER=full"]
