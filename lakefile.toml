name = "Benefuture"
version = "0.1.0"
defaultTargets = ["Benefuture", "BenefutureReference", "benefuture", "BenefutureTest"]

[[lean_lib]]
name = "Benefuture"
globs = ["Benefuture", "Benefuture.+"]

[[lean_lib]]
name = "BenefutureReference"

# Build-time differential tests of the Float reference against the Mathlib specification
# (Mathlib allowed here; never imported by BenefutureReference or Main).
[[lean_lib]]
name = "BenefutureTest"

[[lean_exe]]
name = "benefuture"
root = "Main"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.29.0"
