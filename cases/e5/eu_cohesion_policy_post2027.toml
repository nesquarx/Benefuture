# E5 current-decision case (REPLAY_PREREG §8), registered 2026-11-18; round 1 (sixth in seeded order,
# docs/E5_CANDIDATES.md). Decision: European Union post-2027 Cohesion Policy legislative package (2028-2034
# Multiannual Financial Framework Cohesion & Regional Development regulations, consultations open 2026,
# Council/EP legislative decision window 2027).
# Options as reported in the 9th Cohesion Report (European Commission, March 2024) and High-Level Group on
# the Future of Cohesion Policy (February 2024):
# (1) place-based regional allocation with performance milestones & rule-of-law/institutional-capacity
#     conditionalities (the High-Level Group recommendation);
# (2) centralized national-plan cash transfers modeled on the Recovery and Resilience Facility (RRF) with weak
#     sub-national regional ring-fencing; or
# (3) status-quo input-based absorption reimbursement without institutional-capacity milestones.
# Magnitudes (judgment, stated from the 9th Cohesion Report 2024 and Becker, Egger & von Ehrlich 2010/2013
# JPubE/AEJ empirical evaluations of EU Objective 1 regional transfers): ~EUR 392 billion cohesion envelope;
# Objective 1 / less-developed regions (~125 million people in regions <75% EU average GDP/capita) gain +1.2 to
# +1.6 percentage points annual GDP/productivity and human-capital training when transfers are paired with high
# regional institutional quality, whereas regions with weak absorption/governance show near-zero productivity
# return and higher procurement leakage without capacity conditionalities.

