# Magnitude (judgment, stated): in a COVID-scale pandemic, inequitable access costs about 11.3% of global
# mortality (Moore et al. 2022 preprint: full vaccine sharing would have cut COVID-19 mortality 11.3% by
# January 2022); against about 14.8 million excess deaths in 2020-21 (Msemburi et al. 2023, Nature) that is
# about 1.67 million deaths, borne by low- and middle-income populations: irreparable 1670 (thousands); the
# group mean falls by 1670/6.5e6 x baseline (30, 40) = 0.0077, 0.0103. Pandemics vary in size; a COVID-scale
# one is assumed (judgment, upward of H1N1).

