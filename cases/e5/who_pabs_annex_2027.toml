# E5 current-decision case (REPLAY_PREREG §8), registered 2026-11-07, as of that date. Not scored until the
# outcome is known. Drawn first in round 1 (docs/E5_CANDIDATES.md).
# Decision: the Pathogen Access and Benefit-Sharing (PABS) annex to the WHO Pandemic Agreement, target the
# 80th World Health Assembly (May 2027). Positions as reported: about 100 low- and middle-income countries ask
# for mandatory benefit sharing (guaranteed access to vaccines, therapeutics, diagnostics); high-income
# countries prioritise innovation and unencumbered sequence access; talks extended (WHO, 28 March 2026;
# IGWG7 July 2026; IGWG8 September 2026). Sources are news and WHO releases; the negotiating texts were not read.

