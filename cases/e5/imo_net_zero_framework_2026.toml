# E5 current-decision case (REPLAY_PREREG §8), registered 2026-11-07; round 3 (third in seeded order; the
# watch-listed Artemis case is skipped, criterion 5). Decision: the IMO Net-Zero Framework at the resumed
# extraordinary MEPC session, 4 December 2026 (after MEPC 85, 30 November-3 December). Options as reported: adopt
# as agreed (fuel GHG-intensity standard with its pricing mechanism and fund), adopt without the pricing element
# (the alternative pressed by the US-led coalition), or adjourn again (October 2025: 57-49 to adjourn; MEPC 84,
# April-May 2026: 55-51 to keep the text). Sources are trade press; the regulation text was not read.
# Magnitudes (judgment, stated): shipping emits about 1 Gt CO2 a year; the full framework is taken to cut
# about 10% of it over 2028-2035 (0.8 Gt), half through the standard and half through the price; at the
# mortality cost of carbon, 2.26e-4 deaths per tonne (Bressler 2021, Nature Communications 12, 4467, abstract
# read), each half is about 90,500 lifetime excess deaths, 70% borne by climate-vulnerable populations
# (judgment). Air-pollution co-benefits are not counted (the framework targets GHG; Sofiev et al. 2018 cover
# sulphur), which understates the case for adoption.

