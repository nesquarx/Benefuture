# E5 current-decision case (REPLAY_PREREG §8), registered 2026-11-18; round 1 (fifth in seeded order,
# docs/E5_CANDIDATES.md). Decision: European Grids Package legislative approval in the European Parliament
# plenary vote expected December 2026 (following the European Commission's 2023 EU Action Plan for Grids and
# the 2026 legislative package on cross-border transmission permitting, anticipatory grid investment, and
# congested queue reform).
# Options as reported: (1) adopt the binding package with fast-track cross-border permitting and anticipatory
# investment tariffs; (2) adopt a voluntary coordination and non-binding guidance package without overriding
# national permitting bottlenecks; or (3) reject/defer the package (leaving status-quo national permitting and
# first-come-first-served grid queues).
# Magnitudes (judgment, stated from IEA 2023 Electricity Grids and Secure Energy Transitions and Ember 2024
# European grid queue records): over 400 GW of wind and solar sit in European connection queues; cutting the
# fossil generation tail by accelerating grid connection of queued renewables by ~120 TWh/yr over 2027-2035
# avoids roughly 350 Mt CO2 and concurrent coal/gas PM2.5/NOx air pollution (~4.2 thousand excess premature
# deaths across the EU population over the window; EEA air quality mortality estimates, judgment), while up-front
# anticipatory grid tariffs add ~0.15 happiness cost to grid ratepayers/utilities before congestion savings arrive.

