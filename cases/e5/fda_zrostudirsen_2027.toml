# E5 current-decision case (REPLAY_PREREG §8), registered 2026-11-07; round 3, first in seeded order.
# Decision: FDA accelerated approval of z-rostudirsen (Dyne; Duchenne muscular dystrophy amenable to exon 51
# skipping) on dystrophin production, PDUFA date 21 January 2027 (calendar source, sponsor statements; the
# application itself not read). Options: approve under accelerated approval with a confirmatory trial, or a
# complete response letter (wait for clinical-outcome data). Base rates from earlier Duchenne accelerated or
# conditional approvals on surrogate endpoints, from memory and public reporting, primary records not seen.

id = "fda_zrostudirsen_2027"
title = "FDA: accelerated approval of z-rostudirsen for exon 51-amenable Duchenne muscular dystrophy (PDUFA 21 January 2027)"
family = "health"
era = "2026-2027"
tier = "full"
decision_date = "2026-11-07"
decision_makers = ["US Food and Drug Administration"]
actual_choice = "pending"
actual_outcome_class = "pending"
primary_or_held_out = "e5"

[[sources]]
id = "dmd_surrogate_record"
title = "Duchenne therapies approved on surrogate endpoints and their confirmatory results (ataluren EU 2014, eteplirsen 2016, golodirsen 2019, viltolarsen 2020, casimersen 2021, delandistrogene moxeparvovec 2023)"
as_of_date = "2026-11-07"
url = "https://www.2minutemedicine.com/?p=83226"
notes = "Confirmatory outcomes and safety restrictions from public reporting, recalled; primary records not seen."

[[ groups ]]
id = "eligible_patients"
name = "US boys and young men with exon 51-amenable Duchenne (about 2,000; judgment: about 13% of about 15,000)"
population = 2000
baseline_u = 40.0
baseline_h = 35.0

[[ groups ]]
id = "payers_and_insured"
name = "Those who pay through premiums and public budgets (about 300 million; judgment), in thousands"
population = 300000
baseline_u = 60.0
baseline_h = 60.0

# Magnitudes (judgment, stated): if the drug works, slower decline over the horizon: patients dh +3, du +1;
# if it does not, burden of treatment and false hope: patients dh -0.5; cost about $0.6 billion a year for
# 2,000 patients at about $300,000, spread over payers: dh -0.0005 (judgment). A serious safety signal: about
# 0.3% treated die (the 2025 gene-therapy deaths as an upper analogue; exon skippers have shown none):
# irreparable 6 in the patient group (persons).

[[ options ]]
id = "complete_response_wait"
name = "Complete response letter: wait for clinical-outcome data"
source = "dmd_surrogate_record"
known_date = "2026-11-07"
is_inaction = true
scope_delta = -0.1
pred_du = [0.0, 0.0]
