du = [-0.13, 0.0]
dh = [-0.2, -0.01]
nha = [0.2, 0.0]
irreparable = [10000.0, 0.4]

[[ options ]]
id = "regional_elimination_accessible_areas"
name = "Fund elimination in the most accessible regions first; defer the hardest countries"
source = "smallpox_record"
known_date = "1965-01-01"
is_inaction = false
scope_delta = 0.0
pred_du = [-0.1, 0.0]
pred_dh = [-0.15, -0.005]
pred_nha = [0.15, 0.0]
pred_irreparable = [7500.0, 0.4]

[[ options.scenarios ]]
name = "regional_elimination"
