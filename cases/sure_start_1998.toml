# Historical decision case (E4 contrast case for priority tiers, stylised): England's Sure Start programme announced in
# the Comprehensive Spending Review of July 1998 (about 540 million pounds over three years for early-years services
# in deprived areas), against an equal sum on raising GCSE attainment in the same areas' schools (targets,
# booster classes, exam coaching; stylised). Built so that both options deliver the same quantity (understanding,
# for the same children, equal in size) priced on the same as-of record, differing only in kind: learning capacity and
# the floor (early years) against taught exam content and the median (GCSE targets). As of the decision: the
# Treasury's cross-departmental review of services for young children (1998); US early-childhood results (Perry
# Preschool, Head Start); England's Educational Priority Areas (1968) and school-improvement schemes. Sources: the
# review summary (linked); the rest recalled. Builders know the outcome (evaluations found modest, mixed effects; later
# work found health benefits). Not scored.
# Units: group populations in thousands of persons; `irreparable` in thousands of deaths; u and h on 0-100.

id = "sure_start_1998"
title = "Sure Start early years or GCSE attainment targets in deprived areas (1998; stylised contrast)"
family = "education"
era = "1998"
tier = "full"
decision_date = "1998-07-14"
decision_makers = ["HM Treasury and Department for Education and Employment (stylised alternative)"]
actual_choice = "sure_start_early_years"
actual_outcome_class = "unclear"
primary_or_held_out = "contrast"
irreparable_per_population_unit = 1

[[sources]]
id = "early_years_record"
title = "Cross-departmental review of provision for young children (1998) and area-based education programmes before July 1998"
as_of_date = "1998-07-13"
url = "https://dera.ioe.ac.uk/id/eprint/8814/"
notes = "Review summary used for the programme's aims; programme record recalled."

[[ groups ]]
id = "children_in_deprived_areas"
name = "Children in the most deprived areas, from birth through school (about 1 million, judgment), in thousands"
population = 1000
baseline_u = 35.0
baseline_h = 50.0

[[ groups ]]
id = "taxpayers"
name = "Other residents of England (about 48 million), in thousands"
population = 48000
baseline_u = 55.0
baseline_h = 62.0

# Magnitudes (judgment, stated; equal by design): either programme, if area-based programmes raise outcomes as the
# record suggests, raises the children's understanding by 0.5 on the 0-100 scale over their schooling; if not, a fifth
# of it. Same record for both. Happiness effects equal (+0.1 for the children, satisficing), cost equal (-0.005 for
# other residents).

[[ options ]]
id = "neither"
name = "Neither"
source = "early_years_record"
known_date = "1997-12-31"
is_inaction = true
scope_delta = 0.0
pred_du = [0.0, 0.0]
pred_dh = [0.0, 0.0]
pred_nha = [0.0, 0.0]
pred_irreparable = [0.0, 0.0]

