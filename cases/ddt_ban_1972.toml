# Historical decision case (E4 round 2, REPLAY_PREREG §4.7): the US EPA order of 14 June 1972 (Administrator
# Ruckelshaus) cancelling DDT for nearly all agricultural uses, against the hearing examiner's recommendation to
# keep it. As of the decision: eggshell thinning and raptor declines recorded; DDT and its metabolites persistent
# and accumulating in human fat; no confirmed human harm at background exposure (volunteer and worker studies);
# organophosphate substitutes acutely toxic to farmworkers. Sources recalled from the public record (the EPA
# order and the Sweeney hearing record; primary documents not seen). Builders know the outcome (raptor recovery;
# later IARC classification of DDT as probably carcinogenic; human harm at background levels still contested).
# Units: group populations in thousands of persons; `irreparable` in thousands of deaths; u and h on 0-100.

id = "ddt_ban_1972"
title = "US EPA cancels DDT for most agricultural uses (14 June 1972)"
family = "environment"
era = "1972"
tier = "full"
decision_date = "1972-06-14"
decision_makers = ["EPA Administrator Ruckelshaus"]
actual_choice = "cancel_agricultural_uses"
actual_outcome_class = "good"
primary_or_held_out = "primary_round2"
irreparable_per_population_unit = 1   # populations and deaths both in thousands


# Priority tiers (8.129; declared 2026-11-08 after the outcome was known for E4 cases, so hindsight-exposed; first
# results stay recorded). Kinds by group: us_population = pop, farm_workers = work.
# u: [peak, teachable, meta, median, floor, undirected]; h: [eudaimonic, shareable, satisficing, baseline, median, peak].
[tiers]
u = [[0, 0, 0, 1, 0, 0], [0, 0, 0, 1, 0, 0]]
h = [[0, 0, 0.5, 0, 0.5, 0], [0, 0, 1, 0, 0, 0]]

[[sources]]
id = "pesticide_record"
title = "Persistent pollutant and pesticide record before June 1972 (Minamata, Yusho, DDT volunteer and worker studies, parathion poisonings, eggshell thinning)"
as_of_date = "1972-06-13"
url = "https://www.epa.gov/ingredients-used-pesticide-products/ddt-brief-history-and-status"
notes = "Recalled; primary records not seen."

[[ groups ]]
id = "us_population"
name = "US residents (about 209 million), in thousands"
population = 209000
baseline_u = 55.0
baseline_h = 60.0

[[ groups ]]
id = "farm_workers"
name = "US farm operators and hired farmworkers (about 4 million), in thousands"
population = 4000
baseline_u = 45.0
baseline_h = 50.0

# Magnitudes (judgment, stated): if DDT at accumulated background levels harms human health, about 2 thousand
# premature deaths over the long term (cancers, judgment) with mild ill-health across the population; that
# pathway is environmental (8.118). Cancellation removes most new exposure (residual from persistence: a quarter);
# keeping minor and public-health uses with a phase-down removes about two thirds. Substitution by organophosphates
# poisons farmworkers: if it happens at the 1960s parathion rates, about 0.1 thousand deaths over a decade and
# ill-health among farmworkers; farm costs mildly lower happiness for farm operators.

[[ options ]]
id = "keep_registration"
name = "Keep DDT registered (the hearing examiner's recommendation)"
source = "pesticide_record"
known_date = "1972-04-25"
is_inaction = true
scope_delta = 0.0
