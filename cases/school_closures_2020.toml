# Historical Decision Case: US statewide K-12 school closures (2020-03-20)
# Priced from as-of scenarios (docs/REPLAY_PREREG.md 2b). Events: cases/school_closures_2020.events.csv.
# Imperial College Report 9 (2020-03-16, doi:10.25561/77482): combined interventions halve deaths in the model
# (seen via secondary summary); the unmitigated US toll of about 2.2 million is recalled, not re-read here.
# Honest limit: transmission evidence is influenza (n = 3 located trials) and learning-loss evidence is
# teacher strikes (n = 3), proxies for a novel virus and a pandemic closure; no located negative learning trial.

id = "school_closures_2020"
title = "Spring 2020 Statewide K-12 School Closures"
family = "pandemic"
era = "2020"
tier = "full"
decision_date = "2020-03-20"
decision_makers = ["State Governors", "State Public Health Officers"]
actual_choice = "close_schools_statewide"
actual_outcome_class = "unclear"
primary_or_held_out = "primary"
irreparable_per_population_unit = 1000   # units declared 2026-11-07 for 8.124 death-equivalents: populations in millions, deaths in thousands


# Priority tiers (8.129; declared 2026-11-08 after the outcome was known for E4 cases, so hindsight-exposed; first
# results stay recorded). Kinds by group: students = student, adults_and_staff = pop.
# u: [peak, teachable, meta, median, floor, undirected]; h: [eudaimonic, shareable, satisficing, baseline, median, peak].
[tiers]
u = [[0, 0.4, 0.4, 0.2, 0, 0], [0, 0, 0, 1, 0, 0]]
h = [[0.3, 0, 0.7, 0, 0, 0], [0, 0, 0.5, 0, 0.5, 0]]

[[sources]]
id = "cauchemez_school_holidays_2009"
title = "Closure of schools during an influenza pandemic (Cauchemez et al., Lancet Infect Dis 2009) and Cauchemez et al. Nature 2008"
as_of_date = "2009-06-01"
url = "https://doi.org/10.1038/nature06732"
notes = "School holidays prevent about one in six seasonal influenza cases in France; closure effect heterogeneous and severity dependent."

[[sources]]
id = "strike_literature"
title = "Teacher-strike studies of lost instruction (Belot & Webbink 2010; Baker 2013; Jaume & Willen 2019)"
as_of_date = "2019-12-31"
url = "https://econpapers.repec.org/RePEc:cje:issued:v:46:y:2013:i:3:p:1014-1036"
notes = "Weeks of lost schooling reduce later achievement or earnings in Belgium, Ontario and Argentina."

[[ groups ]]
id = "students"
name = "US K-12 students"
# millions of persons; irreparable counts are thousands of deaths
population = 50
baseline_u = 65.0
baseline_h = 75.0

[[ groups ]]
id = "adults_and_staff"
name = "Other US residents including school staff, parents and older relatives"
population = 280
baseline_u = 70.0
baseline_h = 72.0

[[ options ]]
id = "keep_schools_open"
name = "Keep schools open with hygiene guidance"
source = "cauchemez_school_holidays_2009"
known_date = "2020-03-20"
is_inaction = true
scope_delta = 0.0
pred_du = [0.0, 0.0]
# Typed fields restate the priced expectations (the replay reads the inaction baseline before pricing);
# the scenarios below overwrite them.
pred_dh = [-0.6, -1.8]
pred_nha = [0.0, 0.6]
pred_irreparable = [0.0, 108.0]
lt_end_u = [65.0, 70.0]
lt_end_h = [74.4, 70.2]

# If schools do transmit, keeping them open adds up to one sixth of mitigated-epidemic deaths (France: one in
# six cases; Report 9: combined measures halve about 2.2 million unmitigated US deaths, so about 1.1 million
# remain, one sixth being about 180 thousand). An upper-end anchor from influenza, not a COVID forecast.
[[ options.scenarios ]]
name = "faster_spread_through_schools"
p_chain = ["school_closure_cuts_transmission"]
du = [0.0, 0.0]
dh = [-1.0, -3.0]
nha = [0.0, 1.0]
irreparable = [0.0, 180.0]

[[ options.scenarios ]]
name = "no_difference"
p_chain = []
complement = true
du = [0.0, 0.0]

[[ options ]]
id = "close_schools_statewide"
name = "Close schools statewide for in-person teaching"
source = "strike_literature"
known_date = "2020-03-20"
is_inaction = false
scope_delta = 0.0
pred_du = [-2.4, 0.0]
pred_dh = [-0.8, 0.0]
pred_nha = [0.0, 0.0]
pred_irreparable = [0.0, 0.0]
lt_end_u = [62.6, 70.0]
lt_end_h = [74.2, 72.0]

# Lost instruction: about a third of a school year (10 of 36 weeks, assumed) times an assumed 10 understanding
# points per school year gives -3; wellbeing -1 from isolation (assumed plain magnitude).
[[ options.scenarios ]]
name = "learning_loss"
p_chain = ["closure_learning_loss"]
du = [-3.0, 0.0]
dh = [-1.0, 0.0]
nha = [0.0, 0.0]

[[ options.scenarios ]]
name = "no_lasting_loss"
p_chain = []
complement = true
du = [0.0, 0.0]

# Options added 2026-11-07 after the fourth replay, at the author's direction (the choice should depend on how
# long schools close and what mitigates the loss; recorded in docs/BACKPROPAGATION.md 8.125). As-of basis:
# Spring 2020 closures were announced as two to three weeks; remote instruction was available but weak by the
# record of full-time online schools (CREDO 2015, online charter students' growth far below peers'; recalled,
# primary not seen), so remote learning is taken to keep a quarter of instruction (judgment).
[[ options ]]
id = "close_three_weeks"
name = "Close schools for three weeks, then reassess"
source = "strike_literature"
known_date = "2020-03-13"
is_inaction = false
scope_delta = 0.0
# learning loss 3 of 10 weeks: du -0.9, dh -0.3 at p 0.8; transmission: deaths 70% of the open-schools toll
pred_du = [-0.72, 0.0]
pred_dh = [-0.24, -1.26]
pred_nha = [0.0, 0.42]
pred_irreparable = [0.0, 75.6]

[[ options.scenarios ]]
name = "short_learning_loss"
p_chain = ["closure_learning_loss"]
du = [-0.9, 0.0]
dh = [-0.3, 0.0]

[[ options.scenarios ]]
name = "spread_after_reopening"
p_chain = ["school_closure_cuts_transmission"]
dh = [-0.7, -2.1]
nha = [0.0, 0.7]
irreparable = [0.0, 126.0]

[[ options.scenarios ]]
name = "residual"
p_chain = []
complement = true

[[ options ]]
id = "close_with_remote_learning"
name = "Close schools statewide with remote instruction"
source = "strike_literature"
known_date = "2020-03-13"
is_inaction = false
scope_delta = 0.0
# remote keeps a quarter of instruction: loss 75% of the full closure's (du -2.25, dh -0.75 at p 0.8)
pred_du = [-1.8, 0.0]
pred_dh = [-0.6, 0.0]
pred_nha = [0.0, 0.0]
pred_irreparable = [0.0, 0.0]

[[ options.scenarios ]]
name = "learning_loss_with_remote"
p_chain = ["closure_learning_loss"]
du = [-2.25, 0.0]
dh = [-0.75, 0.0]

[[ options.scenarios ]]
name = "residual"
p_chain = []
complement = true

[counterfactual]
# Later evidence only. Learning loss: NWEA fall-2020 brief (math 5-10 percentile points below prior cohort).
# Deaths avoided by closure: difference-in-differences across states (e.g. Auger et al., JAMA 2020) is the
# named estimator; its figures are PLACEHOLDER bounds here (not extracted this session).
actual_floor_u_delta = -4.0
actual_floor_h_delta = -2.0
actual_irreparable = 0.0
alt_option = "keep_schools_open"
methods = ["state_difference_in_differences_placeholder", "nwea_map_growth_learning_loss"]
est_floor_u_delta_diff = [4.0, 3.0]
est_floor_h_delta_diff = [2.0, 2.0]
est_irreparable_diff = [20.0, 100.0]
