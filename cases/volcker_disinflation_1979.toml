# Historical Decision Case: FOMC shifts to non-borrowed reserves targeting (Saturday 1979-10-06)
# Priced from as-of scenarios (docs/REPLAY_PREREG.md 2b). Events: cases/volcker_disinflation_1979.events.csv.
# Built without running the replay (docs/REPLAY_PREREG.md 4.4). The builder knows the outcome (famous).
#
# HONEST LIMITS
# - The web was reachable only for FRED CSV downloads (CPIAUCNS, UNRATE, FEDFUNDS) in this session; every
#   book, article or FOMC document named below is cited from memory, "(primary not seen)", without pages.
#   FRED series are final vintages, not real-time vintages; CPI is not revised, unemployment seasonal factors
#   were later re-estimated (small).
# - The only as-of US record of tightening is the funds-rate-regime record (5 cycles). No as-of US trial of
#   reserve targeting exists, so the recession probability is the same event for pegging and for targeting;
#   the options differ only in the MAGNITUDES (judgment, below). Probabilities are never typed.
# - Not priced (no discriminating as-of trial): rate volatility under reserve targeting, financial-sector stress,
#   expectations effects, the 1979 credit-control experience. Irreparable harm is set to zero for every option:
#   as-of evidence linking unemployment to mortality (Brenner, JEC testimony 1976, primary not seen) was
#   contested and is not used; this is a judgment, not a finding.
# - Horizon: about two years from the decision. Counts: US residents 225 million (Census 1979, approximate,
#   primary not seen); cyclical-industry workers 25 million (manufacturing about 21 and construction about 4.5
#   million, BLS establishment series, approximate, primary not seen); labor force about 100 million.
#
# MAGNITUDE CONVENTIONS (all JUDGMENT unless a source is named)
# - An extra unemployed person: wellbeing -20 and understanding -3 on the 0-100 scale (judgment; skill and
#   attachment loss). One point of unemployment is 1 million extra unemployed persons.
# - Residents: household spillover x2 (judgment): per point of unemployment dh = -1/225 x 20 x 2 = -0.1778,
#   du = -1/225 x 3 x 2 = -0.02667.
# - Cyclical workers bear 60 percent of extra unemployment (judgment): per point dh = -0.6/25 x 20 = -0.48,
#   du = -0.6/25 x 3 = -0.072.
# - One point of inflation is weighted as one point of unemployment per resident (Okun's misery index, 1970s,
#   equal weights; primary not seen): dh = -0.1778, du = -0.02667 for every being (contested weighting;
#   Barro and others argued smaller). Same figures for both groups (inflation is uniform).
# - Unemployment rises, trough-to-peak, FRED UNRATE (computed this session): 1957-58 4.2 -> 7.5 (+3.3, Jul 1957
#   -> Jul 1958); 1960-61 5.2 -> 7.1 (+1.9, Apr 1960 -> May 1961); 1969-70 3.5 -> 6.1 (+2.6, Nov 1969 -> Dec 1970);
#   1973-75 4.6 -> 9.0 (+4.4, Oct 1973 -> May 1975). Mean +3.05 points; largest +4.4. Unemployment in Sep 1979
#   was 5.9 percent.
# - CPI December/December inflation, FRED CPIAUCNS (computed this session): 1965 1.9, 66 3.5, 67 3.0, 68 4.7,
#   69 6.2, 70 5.6, 71 3.3, 72 3.4, 73 8.7, 74 12.3, 75 6.9, 76 4.9, 77 6.7, 78 9.0. Rise in the eight rising
#   years 1966-78: mean +2.24 points (1.6, 1.7, 1.5, 0.1, 5.3, 3.6, 1.8, 2.3). Fall over the four recession-trough
#   years 1958 -1.1, 1961 -0.7, 1970 -0.6, 1975 -5.4: mean -1.95; largest -5.4. Korean-War controls 1951 6.0 ->
#   1952 0.8 (-5.2). Carter guidelines: CPI Oct 1978 year-on-year 8.9 -> Aug 1979 11.8 (+2.9).
# - baseline_u/baseline_h are scale conventions (as in the exemplars), not measurements.

id = "volcker_disinflation_1979"
title = "FOMC Abandons Funds-Rate Pegging for Non-Borrowed Reserves Targeting (1979)"
family = "monetary"
era = "1979"
tier = "full"
decision_date = "1979-10-06"
decision_makers = ["Federal Open Market Committee (Paul Volcker)"]
actual_choice = "reserve_targeting"
actual_outcome_class = "good"
primary_or_held_out = "held_out"


# Priority tiers (8.129; declared 2026-11-08 after the outcome was known for E4 cases, so hindsight-exposed; first
# results stay recorded). Kinds by group: us_residents = pop, cyclical_industry_workers = work.
# u: [peak, teachable, meta, median, floor, undirected]; h: [eudaimonic, shareable, satisficing, baseline, median, peak].
[tiers]
u = [[0, 0, 0, 1, 0, 0], [0, 0, 0, 1, 0, 0]]
h = [[0, 0, 0.5, 0, 0.5, 0], [0, 0, 1, 0, 0, 0]]

[[sources]]
id = "us_tightening_cycles_1955_1974"
title = "US funds-rate and discount-rate tightening cycles 1955-1974 against NBER business-cycle peaks (Federal Reserve H.15 series; NBER reference dates)"
as_of_date = "1979-09-30"
url = "https://fred.stlouisfed.org/series/FEDFUNDS"
notes = "Five cycles; recession peaks Aug 1957, Apr 1960, Dec 1969, Nov 1973; none within 24 months of the 1965-66 cycle. Cycle dating is the builder's reading of the rate series (judgment)."

[[sources]]
id = "us_cpi_unemployment_1957_1979"
title = "BLS CPI-U (Dec/Dec) and civilian unemployment rate 1957-1979 (BLS via FRED CPIAUCNS and UNRATE, final vintage)"
as_of_date = "1979-09-30"
url = "https://fred.stlouisfed.org/series/CPIAUCNS"
notes = "Source of the unemployment-rise and inflation-change magnitudes; the track record is the directional claim that inflation falls only when recession slack opens."

[[sources]]
id = "price_control_episodes_1942_1979"
title = "US wage-price control episodes: WWII OPA 1942-46, Korean War 1951-53, Nixon 1971-74, Carter guidelines from Oct 1978 (Kosters 1975 AEI and Weber and Mitchell 1978 Brookings are the retrospectives; primary not seen, pages not verified)"
as_of_date = "1979-09-30"
url = "https://fred.stlouisfed.org/series/CPIAUCNS"
notes = "Outcome read from the CPI series, not from the retrospectives."

[[ groups ]]
id = "us_residents"
name = "US residents"
# millions of persons (Census 1979, approximate)
population = 225
baseline_u = 68.0
baseline_h = 66.0

[[ groups ]]
id = "cyclical_industry_workers"
name = "Workers in rate-sensitive industries (manufacturing, construction)"
# millions of persons (BLS establishment series, approximate)
population = 25
baseline_u = 62.0
baseline_h = 60.0

[[ options ]]
id = "continue_funds_rate_pegging"
name = "Continue gradual funds-rate tightening within a narrow target band (status quo course)"
sources = ["us_tightening_cycles_1955_1974", "us_cpi_unemployment_1957_1979"]
known_date = "1979-09-18"
is_inaction = true
scope_delta = 0.0
# Typed fields restate the priced expectations (the replay reads the inaction baseline before pricing);
# the scenarios below overwrite them. Laplace rate (4+1)/(5+2) = 5/7 = 0.714286 for recession; 2/7 = 0.285714
# complement. E[du] = 5/7 x [-0.0293, -0.1676] + 2/7 x [-0.0597, -0.0597];
# E[dh] = 5/7 x [-0.1956, -1.1173] + 2/7 x [-0.3982, -0.3982].
pred_du = [-0.038019, -0.136781]
pred_dh = [-0.25346, -0.911873]
pred_nha = [0.0, 0.0]
pred_irreparable = [0.0, 0.0]
lt_end_u = [67.961981, 61.863219]
lt_end_h = [65.74654, 59.088127]

# Every prior US tightening cycle ran under the funds-rate regime, so the record of 5 cycles is this option's
# own record. A recession follows with the mean as-of unemployment rise (+3.05 points) and the mean inflation
# fall of the trough years (1.95 points). Residents: dh = -0.1778 x 3.05 + 0.1778 x 1.95 = -0.1956;
# du = -0.0293. Workers: dh = -0.48 x 3.05 + 0.1778 x 1.95 = -1.1173; du = -0.1676.
[[ options.scenarios ]]
name = "recession_after_gradual_tightening"
p_chain = ["recession_follows_tightening_cycle"]
du = [-0.029333, -0.1676]
dh = [-0.195556, -1.117333]
nha = [0.0, 0.0]

# No recession: inflation keeps rising by the mean of the rising years (+2.24 points; judgment that the
# no-recession cycle looks like the average rising year): dh = -0.1778 x 2.24 = -0.3982; du = -0.0597.
[[ options.scenarios ]]
name = "no_recession_inflation_keeps_rising"
p_chain = []
complement = true
du = [-0.059733, -0.059733]
dh = [-0.398222, -0.398222]
nha = [0.0, 0.0]

[[ options ]]
id = "reserve_targeting"
name = "Target non-borrowed reserves, let the funds rate float widely, raise the discount rate to 12 percent"
sources = ["us_tightening_cycles_1955_1974", "us_cpi_unemployment_1957_1979"]
known_date = "1979-10-06"
is_inaction = false
scope_delta = 0.0
# E[du] = 5/7 x [0.0267, -0.1728] + 2/7 x 0; E[dh] = 5/7 x [0.1778, -1.152] + 2/7 x 0.
pred_du = [0.019048, -0.123429]
pred_dh = [0.126984, -0.822857]
pred_nha = [0.0, 0.0]
pred_irreparable = [0.0, 0.0]
lt_end_u = [68.019048, 61.876571]
lt_end_h = [66.126984, 59.177143]

# No as-of US trial of reserve targeting exists: the recession rate is the same event as above. Magnitudes use
# the largest as-of episode as the analogue of a harder, faster tightening (JUDGMENT): unemployment +4.4
# (1973-75) and inflation falling 5.4 (1975). Residents: dh = -0.1778 x 4.4 + 0.1778 x 5.4 = 0.1778;
# Workers: dh = -0.48 x 4.4 + 0.1778 x 5.4 = -1.152.
[[ options.scenarios ]]
name = "recession_with_fast_disinflation"
p_chain = ["recession_follows_tightening_cycle"]
du = [0.026667, -0.1728]
dh = [0.177778, -1.152]
nha = [0.0, 0.0]

# Tight enough to avoid acceleration without a recession: no change (assumed; the 1966 cycle shows inflation
# 3.5 -> 3.0 the next year, not used).
[[ options.scenarios ]]
name = "no_recession_inflation_contained"
p_chain = []
complement = true
du = [0.0, 0.0]
dh = [0.0, 0.0]
nha = [0.0, 0.0]

[[ options ]]
id = "incomes_policy"
name = "Rely on wage-price guidelines or controls (incomes policy) with the funds-rate course unchanged"
sources = ["price_control_episodes_1942_1979"]
known_date = "1978-10-24"
is_inaction = false
scope_delta = 0.0
# Laplace rate (1+1)/(4+2) = 1/3 for controls holding; 2/3 complement.
# E[du] = 1/3 x 0.1387 + 2/3 x -0.0773; E[dh] = 1/3 x 0.9244 + 2/3 x -0.5156.
pred_du = [-0.005333, -0.005333]
pred_dh = [-0.035556, -0.035556]
pred_nha = [0.0, 0.0]
pred_irreparable = [0.0, 0.0]
lt_end_u = [67.994667, 61.994667]
lt_end_h = [65.964444, 59.964444]

# Korean-War controls are the one as-of success: inflation fell 5.2 points (1951 6.0 -> 1952 0.8); no recession
# cost is assumed because policy rates are unchanged. dh = +0.1778 x 5.2 = 0.9244.
[[ options.scenarios ]]
name = "controls_hold_inflation_down"
p_chain = ["controls_hold_inflation_after_decontrol"]
du = [0.138667, 0.138667]
dh = [0.924444, 0.924444]
nha = [0.0, 0.0]

# Controls fail: inflation rises by the most recent as-of failure, the Carter guidelines (+2.9 points).
# Shortage and distortion costs of controls (1973 meat and fuel shortages) are not priced (no as-of figure).
[[ options.scenarios ]]
name = "controls_fail_inflation_rises"
p_chain = []
complement = true
du = [-0.077333, -0.077333]
dh = [-0.515556, -0.515556]
nha = [0.0, 0.0]

[counterfactual]
# Later evidence only. PLACEHOLDER magnitudes, no published counterfactual extracted this session. Actual path
# (FRED, this session): unemployment 5.9 (Sep 1979) -> 10.8 (Dec 1982), +4.9 points; CPI Dec/Dec 12.5, 8.9, 3.8
# for 1980-82, 9.5 points below 1979's 13.3. Same conversions as above: residents dh = -0.1778 x 4.9 + 0.1778 x 9.5
# = +0.82; workers dh = -0.48 x 4.9 + 0.1778 x 9.5 = -0.66 (du +0.12, -0.10). Pegging counterfactual assumed an
# ordinary recession (+1.9 points, the mildest as-of rise) with no inflation relief: residents dh -0.34, workers
# dh -0.91 (du -0.05, -0.14). Differences are alt minus actual; named estimators are not extracted.
actual_floor_u_delta = -0.1
actual_floor_h_delta = -0.66
actual_irreparable = 0.0
alt_option = "continue_funds_rate_pegging"
methods = ["sacrifice_ratio_placeholder", "frb_us_counterfactual_placeholder"]
est_floor_u_delta_diff = [-0.17, -0.04]
est_floor_h_delta_diff = [-1.16, -0.25]
est_irreparable_diff = [0.0, 0.0]
