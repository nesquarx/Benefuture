# Historical decision case (E4 round 2, REPLAY_PREREG §4.7): UN Security Council Resolution 912, 21 April 1994,
# reducing UNAMIR in Rwanda from about 2,500 to 270 personnel. As of the decision: the 11 January 1994 cable from
# UNAMIR's commander reporting an informant's account of plans and lists to exterminate Tutsi; mass killing since
# 7 April; ten Belgian peacekeepers killed on 7 April and Belgium's withdrawal; the commander's request for
# reinforcement and a stronger mandate (about 5,000 troops). Sources recalled from the public record (UN
# Independent Inquiry 1999 retells the as-of record; primary documents not seen). Builders know the outcome.
# Units: group populations in thousands of persons; `irreparable` in thousands of deaths; u and h on 0-100.

id = "unamir_drawdown_1994"
title = "UN Security Council reduces UNAMIR in Rwanda to 270 personnel (Resolution 912, 21 April 1994)"
family = "security"
era = "1994"
tier = "full"
decision_date = "1994-04-21"
decision_makers = ["UN Security Council"]
actual_choice = "reduce_to_270"
actual_outcome_class = "bad"
primary_or_held_out = "primary_round2"


