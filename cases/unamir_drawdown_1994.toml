# Magnitudes (judgment, stated, as of 21 April): killing at the reported pace of the first two weeks (tens of
# thousands, with lists and radio incitement) would, unchecked for three months, reach about 500 thousand of the
# targeted group; a mission able to protect concentrations and deter would cut that to about 100 thousand
# (judgment; no as-of estimate of a counterfactual existed). A death takes u and h to zero: group means fall by
# deaths/1,200 x baseline. Peacekeeper deaths in a reinforced Chapter VII mission: about 0.1 thousand (judgment,
# from the ten Belgians and UNOSOM II's losses).

