# Historical decision case (E4 round 2, REPLAY_PREREG §4.7): the US decision of 24 March 1976 to vaccinate the
# whole population against the swine influenza strain found at Fort Dix (February 1976: one recruit's death,
# about 230 infected by serology). As of the decision: a strain related to the 1918 virus, no spread beyond Fort
# Dix yet, the pandemics of 1957 and 1968 in memory. Sources recalled from the public record (Neustadt and
# Fineberg's later account retells the as-of record; primary documents not seen). Builders know the outcome
# (no pandemic; Guillain-Barré cases among about 45 million vaccinated; programme halted in December).
# Units: group populations in thousands of persons; `irreparable` in thousands of deaths; u and h on 0-100.

id = "swine_flu_vaccination_1976"
title = "US mass vaccination against swine influenza after Fort Dix (24 March 1976)"
family = "health"
era = "1976"
tier = "full"
decision_date = "1976-03-24"
decision_makers = ["President Ford on CDC and advisory committee advice"]
actual_choice = "vaccinate_everyone"
actual_outcome_class = "bad"
primary_or_held_out = "primary_round2"


# Priority tiers (8.129; declared 2026-11-08 after the outcome was known for E4 cases, so hindsight-exposed; first
# results stay recorded). Kinds by group: us_population = pop.
# u: [peak, teachable, meta, median, floor, undirected]; h: [eudaimonic, shareable, satisficing, baseline, median, peak].
[tiers]
u = [[0, 0, 0, 1, 0, 0]]
h = [[0, 0, 0.5, 0, 0.5, 0]]

[[sources]]
id = "influenza_record"
title = "Novel influenza outbreaks and mass influenza vaccination campaigns before 1976 (1918, 1957, 1968 pandemics; 1974 Wisconsin swine case; 1957 and 1968 vaccination campaigns)"
as_of_date = "1976-03-23"
url = "https://www.cdc.gov/flu/pandemic-resources/basics/past-pandemics.html"
notes = "Recalled; primary records not seen."

[[ groups ]]
id = "us_population"
name = "US residents (about 215 million), in thousands"
population = 215000
baseline_u = 55.0
baseline_h = 60.0

# Magnitudes (judgment, stated): a pandemic of the 1957/1968 kind kills about 70 thousand in the US (1957 about
# 116 thousand, 1968 about 100 thousand, recalled; taken lower for better care in 1976); with the whole
# population offered vaccine before it arrives, about half averted (efficacy about 0.7, uptake well short of
# all); with vaccine produced and stockpiled but given only on evidence of spread, about a quarter averted (it
# arrives late). A mass campaign's serious adverse events: if a rate above 1 per 100,000 materialises, about 0.05
# thousand deaths among about 100 million vaccinated (judgment). Programme cost: about 135 million dollars
# (recalled): happiness -0.01 across the population.

[[ options ]]
id = "stockpile_and_watch"
name = "Produce and stockpile vaccine; vaccinate if the strain spreads"
source = "influenza_record"
known_date = "1976-03-22"
is_inaction = true
scope_delta = 0.0
pred_du = [-0.006, 0.0]
pred_dh = [-0.012, 0.0]
pred_nha = [0.0, 0.0]
pred_irreparable = [26.3, 0.0]

[[ options.scenarios ]]
name = "pandemic_with_late_vaccine"
p_chain = ["novel_strain_outbreak_became_pandemic"]
du = [-0.01, 0.0]
dh = [-0.015, 0.0]
irreparable = [52.5, 0.0]

[[ options.scenarios ]]
name = "no_pandemic_stockpile_cost"
