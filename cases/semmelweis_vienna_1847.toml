# Historical Decision Case: Vienna General Hospital Handwashing Rejection (Semmelweis, 1849-03-20)
# Source: Best & Neuhauser (2004), https://doi.org/10.1136/qshc.2004.010918; Semmelweis (1861)
# Tier: Coarse low-technology tier (8.88) — monthly maternal mortality counts in First vs Second Clinic.

id = "semmelweis_vienna_1847"
title = "Institutional Rejection of Semmelweis Chlorinated-Lime Handwashing at Vienna General Hospital (1849)"
family = "low_technology"
era = "1847-1849"
tier = "coarse"
decision_date = "1849-03-20"
decision_makers = ["Johann Klein & Vienna General Hospital Administration"]
actual_choice = "dismiss_semmelweis_relax_handwashing"
actual_outcome_class = "bad"
primary_or_held_out = "primary"

[[sources]]
id = "vienna_maternity_mortality_1841_1848"
title = "First and Second Obstetrics Clinic Monthly Maternal Mortality Ledger (1841-1848)"
as_of_date = "1849-01-01"
url = "https://doi.org/10.1136/qshc.2004.010918"
notes = "Pre-May 1847 First Clinic maternal mortality averaged 9.9% (vs 3.4% in midwifery Second Clinic); following compulsory chlorinated-lime handwashing in May 1847, First Clinic mortality fell to 1.27% across 1848 (45 deaths in 3,556 births)."

[[ groups ]]
id = "maternity_patients_and_infants"
name = "First Clinic Maternity Patients and Newborns"
population = 3500
baseline_u = 30.0
baseline_h = 40.0

[[ groups ]]
id = "medical_faculty_and_students"
name = "Obstetrics Physicians and Medical Students"
population = 60
baseline_u = 55.0
baseline_h = 60.0

[[ options ]]
id = "retain_handwashing_protocol"
name = "Retain compulsory chlorinated-lime handwashing between autopsy/examination and delivery"
source = "vienna_maternity_mortality_1841_1848"
known_date = "1847-05-15"
is_inaction = true
scope_delta = 0.3
# Legacy keys kept only because the loader reads the inaction option's values before pricing; they equal
# the scenario expectations below (0.0435 x [-3.48, 0], 0.0435 x [-4.64, 0], 0.0435 x [406, 0]).
pred_du = [-0.151, 0.0]
pred_dh = [-0.202, 0.0]
pred_nha = [0.0, 0.0]
pred_irreparable = [17.7, 0.0]

# Scenario pricing (amendment 2026-11-05). Horizon one year, 3500 births (1848: 3556). A month is an
# "epidemic month" when First Clinic mortality is at least 5%. Excess deaths are counted above the protected
# non-epidemic rate (1.97%, Jun 1847 - Feb 1849), the background no option can remove; a death takes the
# mother's understanding and happiness to zero, so the group mean falls by (deaths/3500) x baseline (30, 40).
# Epidemic month: mean 13.56% (Jan 1841 - Apr 1847), excess 11.59% = 406 deaths a year if every month were one.
# With handwashing 0 of 21 months were epidemic; the scenario still keeps the unprotected epidemic size.
[[ options.scenarios ]]
name = "epidemic_despite_protocol"
p_chain = ["month_ge_5pct_with_handwashing"]
du = [-3.48, 0.0]
dh = [-4.64, 0.0]
irreparable = [406.0, 0.0]

[[ options.scenarios ]]
name = "protected_clinic"
p_chain = []
complement = true

[[ options ]]
id = "dismiss_semmelweis_relax_handwashing"
name = "Do not renew Semmelweis's appointment and relax cadaveric handwashing enforcement"
source = "vienna_maternity_mortality_1841_1848"
known_date = "1849-03-20"
is_inaction = false
scope_delta = -0.5
pred_du = [0.0, 0.0]
pred_dh = [0.0, 0.0]
pred_nha = [0.0, 0.0]
pred_irreparable = [0.0, 0.0]

# Without handwashing 53 of 75 months (Jan 1841 - Apr 1847) were epidemic months (rate 0.70). In the
# remaining months the unprotected rate was 2.95%, 0.98 points above the protected floor: 34 excess deaths a
# year, du -0.29, dh -0.39.
[[ options.scenarios ]]
name = "epidemic_month_regime"
p_chain = ["month_ge_5pct_without_handwashing"]
du = [-3.48, 0.0]
dh = [-4.64, 0.0]
irreparable = [406.0, 0.0]

[[ options.scenarios ]]
name = "sporadic_months"
p_chain = []
complement = true
du = [-0.29, 0.0]
dh = [-0.39, 0.0]
irreparable = [34.0, 0.0]

[counterfactual]
actual_floor_u_delta = -5.0
actual_floor_h_delta = -12.0
actual_irreparable = 8.6
alt_option = "retain_handwashing_protocol"
methods = ["clinic_difference_in_differences", "interrupted_time_series_1847_1855"]
est_floor_u_delta_diff = [5.5, 5.2]
est_floor_h_delta_diff = [12.5, 11.8]
est_irreparable_diff = [-8.6, -7.9]

