# Historical Decision Case: Montreal Protocol on Substances that Deplete the Ozone Layer (1987-09-16)
# Scenario-priced (docs/REPLAY_PREREG.md section 2b): every option effect below is a scenario known before the
# decision date; probabilities are Laplace rates over cases/montreal_protocol_1987.events.csv rows dated on or
# before 1987-09-16. Units: group populations in millions of persons; `irreparable` counts premature deaths in
# units of 100 persons (so 2000 = 200,000 deaths); u and h in the 0-100 scale of the other cases.
# Excluded on date grounds: the US EPA Regulatory Impact Analysis (December 1987), the 1988 Ozone Trends Panel
# and every post-1987 measurement; the preregistration lists the EPA analysis, but it post-dates the decision.

id = "montreal_protocol_1987"
title = "Montreal Protocol on Substances that Deplete the Ozone Layer"
family = "long_horizon"
era = "1987"
tier = "full"
decision_date = "1987-09-16"
decision_makers = ["UNEP", "US EPA", "European Community", "Japan", "UK", "24 signatory nations"]
actual_choice = "adopt_cfc_phase_down"
actual_outcome_class = "good"
primary_or_held_out = "primary"
irreparable_per_population_unit = 10000   # units declared 2026-11-07 for 8.124 death-equivalents: populations in millions, deaths in 100s

[[sources]]
id = "nas_ozone_assessments"
title = "US National Research Council / NAS assessments of CFC ozone depletion (1976, 1979, 1982, 1984)"
as_of_date = "1984-03-01"
url = "https://physicstoday.aip.org/news/new-assessments-of-ozone-depletion"
notes = "Four successive assessments each project positive steady-state column ozone loss from continued CFC release (7, 16.5, 5-9, 2-4 percent); magnitudes fell with revised chemistry while the sign never changed. Secondary summaries only; primary reports not read."

[[sources]]
id = "halley_toms_observations"
title = "Antarctic springtime ozone loss observed at Halley Bay (1985) and by Nimbus-7 TOMS (1986)"
as_of_date = "1986-08-31"
url = "https://doi.org/10.1038/315207a0"
notes = "Farman et al. (Nature 315:207, 1985) and Stolarski et al. (Nature 322:808, 1986). Observed loss; the chemical attribution to CFCs was still contested at the decision date."

[[sources]]
id = "us_aerosol_precedent"
title = "US 1978 ban on non-essential CFC aerosol propellants"
as_of_date = "1978-12-31"
url = "https://www.epa.gov/archive/epa/aboutepa/government-ban-fluorocarbon-gases-aerosol-products-begins-october-15-1978.html"
notes = "A national use restriction on the largest CFC use (over half of 1970s US consumption) was carried out; producers had already switched to other propellants or mechanical pumps."

[[ groups ]]
id = "world_public"
name = "World population exposed to UV-B (about 5 billion in 1987)"
population = 5000
baseline_u = 65.0
baseline_h = 65.0

[[ groups ]]
id = "cfc_sector"
name = "CFC producers, refrigeration and foam users and their workforces (order of 1 million persons, judgment)"
population = 1
baseline_u = 70.0
baseline_h = 70.0

[[ options ]]
id = "delay_await_certainty"
name = "Defer binding controls until the CFC-ozone link is certain (continue review and voluntary measures)"
source = "nas_ozone_assessments"
known_date = "1987-09-15"
is_inaction = true
scope_delta = 0.0
# The replay reads the not-acting baseline from these typed fields before it prices scenarios, so they carry
# the baseline option's own scenario expectation, computed from the events file below: 0.625 x (-3, -3, 6, 2000).
pred_du = [-1.875, 0.0]
pred_dh = [-1.875, 0.0]
pred_nha = [3.75, 0.0]
pred_irreparable = [1250.0, 0.0]

# Scenario pricing: with emissions growing, assessments project depletion (4 of 4 NRC rounds) and loss is
# observed (2 of 2 records), so P(depletion continues) = (5/6)(3/4) = 0.625. Consequence magnitude is a
# judgment from the NAS dose-response of the time (about 2 to 3 percent more non-melanoma skin cancer per 1
# percent ozone loss) at 2 to 10 percent loss: ill-health across the exposed population and 200,000
# premature deaths over the long term (irreparable 2000 units of 100).
[[ options.scenarios ]]
name = "depletion_continues"
environmental_health = true   # 8.118: an environmental pathway to health harm (tagged after the ruling)
p_chain = ["assessment_projects_depletion", "observed_ozone_loss"]
du = [-3.0, 0.0]
dh = [-3.0, 0.0]
nha = [6.0, 0.0]
irreparable = [2000.0, 0.0]

[[ options.scenarios ]]
name = "no_material_depletion"
p_chain = []
complement = true

[[ options ]]
id = "adopt_cfc_phase_down"
name = "Adopt binding freeze and 50 percent phase-down of five CFCs and three halons with a review clause"
source = "us_aerosol_precedent"
known_date = "1987-09-15"
is_inaction = false
scope_delta = 1.0
pred_du = [0.0, 0.0]
pred_dh = [0.0, 0.0]
pred_nha = [0.0, 0.0]
pred_irreparable = [0.0, 0.0]

# Scenario pricing: a use restriction of this kind was carried out once before (US 1978 aerosol ban,
# 1 of 1), so P(workable) = 2/3 with a mild transition cost to the sector; the complement is a costly
# transition (substitutes slow or dear: dh -3 and passing harms 3 for the workforce; judgment). Transition costs are income and
# employment, so they price happiness (dh, nha), not understanding (du).
[[ options.scenarios ]]
name = "restriction_workable"
p_chain = ["aerosol_restriction_achieved_target"]
dh = [0.0, -0.5]

[[ options.scenarios ]]
name = "transition_costly"
p_chain = []
complement = true
dh = [-0.2, -3.0]
nha = [0.0, 3.0]

# A 50 percent cut does not remove the loss that is already committed by long-lived CFCs; the same chain as
# above applies to a reduced, reparable residual (not irreparable: the review clause lets controls tighten as
# evidence arrives). Judgment: half the delay scenario's ill-health, no priced deaths.
[[ options.scenarios ]]
name = "residual_depletion"
environmental_health = true   # 8.118: an environmental pathway to health harm (tagged after the ruling)
p_chain = ["assessment_projects_depletion", "observed_ozone_loss"]
du = [-1.5, 0.0]
dh = [-1.5, 0.0]
nha = [3.0, 0.0]

[counterfactual]
actual_floor_u_delta = 0.0
actual_floor_h_delta = -0.5
actual_irreparable = 0.0
alt_option = "delay_await_certainty"
# Estimators (later evidence, scoring outcomes not the choice): the NASA Goddard "World Avoided" chemistry-climate
# run (Newman et al. 2009, Atmos. Chem. Phys. 9:2113: 17 percent global column loss by 2020 and 67 percent by
# 2065 against 1980 with unregulated growth; erythemal UV more than doubled at northern midlatitudes by 2060),
# and UV dose-response scaling to skin-cancer mortality. Magnitudes are order-of-magnitude judgments, not
# sourced counts. Differences are alternative minus actual (negative u/h: the delay is worse; positive irreparable:
# more deaths).
methods = ["world_avoided_chemistry_climate_model", "uv_dose_response_scaling"]
est_floor_u_delta_diff = [-15.0, -8.0]
est_floor_h_delta_diff = [-15.0, -8.0]
est_irreparable_diff = [20000.0, 5000.0]
